name: dakhl
description: "Dakhl — Persian monthly income & expense manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  another_telephony: ^0.4.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.0.0
  go_router: ^17.4.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  persian_datetime_picker: ^3.2.0
  shamsi_date: ^1.1.1
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
